<div class="inscription-container">
    <div class="inscription-card">
        <h1>Inscription</h1>
        <p class="subtitle">Rejoignez MétéoLive</p>
        <form #form="ngForm" (ngSubmit)="onSubmit(form)">
            <div class="form-group">
                <label>Pseudo</label>
                <input type="text" name="pseudo" ngModel required placeholder="Votre pseudo">
            </div>
            <div class="form-group">
                <label>Adresse e-mail</label>
                <input type="email" name="email" ngModel required email placeholder="Votre email" #emailInput="ngModel">
                <p class="erreur-champ" *ngIf="emailInput.invalid && emailInput.touched">
                    Veuillez entrer un email valide.
                </p>
            </div>
            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password" name="password" ngModel required minlength="9" placeholder="Votre mot de passe" #passwordInput="ngModel">
                <p class="erreur-champ" *ngIf="passwordInput.invalid && passwordInput.touched">
                    Le mot de passe doit contenir au moins 9 caractères.
                </p>
            </div>
            <div *ngIf="erreur" class="erreur-message">
                ⚠️ {{ erreur }}
            </div>

            <button type="submit" class="btn-primary" [disabled]="!form.valid || loading">
                <span *ngIf="!loading">S'inscrire</span>
                <span *ngIf="loading">Inscription en cours...</span>
            </button>
        </form>
        <p class="redirect">
            Déjà un compte ?
            <a (click)="connexion()">Se connecter</a>
        </p>
    </div>
</div>
