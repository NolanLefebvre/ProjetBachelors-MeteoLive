name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: meteolive_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring

      - name: Create .env file
        run: |
          echo "APP_ENV=test" > .env
          echo "DEFAULT_URI=http://localhost" >> .env
          echo "CORS_ALLOW_ORIGIN=^https?://localhost(:[0-9]+)?$" >> .env
          echo "JWT_PASSPHRASE=test" >> .env
          echo "JWT_SECRET_KEY=%kernel.project_dir%/config/jwt/private.pem" >> .env
          echo "JWT_PUBLIC_KEY=%kernel.project_dir%/config/jwt/public.pem" >> .env
          echo "DATABASE_URL=mysql://root:root@127.0.0.1:3306/meteolive?serverVersion=8.0" >> .env
        working-directory: meteolive-backend

      - name: Generate JWT keys
        run: |
          mkdir -p config/jwt
          openssl genrsa -aes256 -passout pass:test -out config/jwt/private.pem 4096
          openssl rsa -in config/jwt/private.pem -passin pass:test -pubout -out config/jwt/public.pem
        working-directory: meteolive-backend

      - name: Install dependencies
        run: composer install --no-interaction
        working-directory: meteolive-backend

      - name: Create database schema
        run: php bin/console doctrine:schema:create --env=test
        working-directory: meteolive-backend

      - name: Run tests
        run: php bin/phpunit
        working-directory: meteolive-backend

  # Sécurité de la chaîne de développement :
  # détection de secrets + audit des dépendances (back et front)
  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Secret scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4 # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2
        with:
          php-version: '8.4'

      - name: Audit des dépendances PHP (composer audit)
        run: composer audit
        working-directory: meteolive-backend

      - name: Audit des dépendances Angular (npm audit)
        run: |
          ANGULAR_JSON=$(find . -name angular.json -not -path '*/node_modules/*' | head -n 1)
          if [ -z "$ANGULAR_JSON" ]; then
            echo "Aucun angular.json trouvé : impossible de localiser le front."
            exit 1
          fi
          FRONT_DIR=$(dirname "$ANGULAR_JSON")
          echo "Front détecté dans : $FRONT_DIR"
          cd "$FRONT_DIR"
          npm audit --audit-level=high

  # Analyse statique du code source (SAST) : PHP + TypeScript
  sast:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Analyse statique (Semgrep)
        run: semgrep scan --config p/php --config p/typescript --config p/owasp-top-ten --error

