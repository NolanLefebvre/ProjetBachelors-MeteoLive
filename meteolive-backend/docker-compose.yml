version: '3.8'

services:
  symfony:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: mysql://root:root@mysql:3306/meteolive
      JWT_SECRET_KEY: /var/www/config/jwt/private.pem
      JWT_PUBLIC_KEY: /var/www/config/jwt/public.pem
      JWT_PASSPHRASE: ${JWT_PASSPHRASE}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY}
    depends_on:
      - mysql
    volumes:
      - .:/var/www

  angular:
    build:
      context: ../meteolive-frontend
    ports:
      - "4200:80"

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: meteolive
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: